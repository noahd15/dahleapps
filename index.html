<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dahle Apps</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f4f0; --ink: #1d1b18; --muted: #6b655c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161518; --ink: #efebe4; --muted: #a39c92; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p { color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Dahle Apps</h1>
  <p>Small puzzle games for iPhone and iPad, made by Noah Dahle.</p>
  <p>Contact: <a href="mailto:dahle.apps@gmail.com">dahle.apps@gmail.com</a></p>
</main>
</body>
</html>
